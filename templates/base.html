<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebTools{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block bodyClass %}{% endblock %}">
    <header class="cabecera">
        <div class="cabeceraIzquierda">
            <a href="{{ url_for('index') }}" class="logo">WebTools</a>
        </div>
        <div class="cabeceraDerecha">
            <span class="ipPublica">IP publica: {{ clientIp }}</span>
            <span class="fechaHora" id="fechaHora"></span>
            <a class="enlaceAjustes" href="{{ url_for('ajustes') }}" title="Ajustes" aria-label="Ajustes">&#9881;</a>
        </div>
    </header>

    <main class="contenido">
        {% block content %}{% endblock %}
    </main>

    <footer class="pie">
        <a href="https://github.com/FranciscoFdez05" target="_blank" rel="noopener noreferrer">github.com/FranciscoFdez05</a>
        <span class="versionPie">WebsTools v{{ version }}</span>
    </footer>

    <script src="{{ url_for('static', filename='js/reloj.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
