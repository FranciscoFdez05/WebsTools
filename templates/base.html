<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebTools{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block bodyClass %}{% endblock %}">
    <header class="cabecera">
        <div class="cabeceraIzquierda">
            <a href="{{ url_for('index') }}" class="logo">WebTools</a>
            <div class="contenedorVersion">
                <button type="button" class="versionCabecera" id="botonVersion" title="Ver version y actualizar"
                        aria-haspopup="dialog" aria-expanded="false">v{{ version }}</button>
                <div class="popupVersion" id="popupVersion" role="dialog" aria-label="Version de WebsTools" hidden
                     data-api-url="{{ url_for('apiVersion') }}"
                     data-actualizar-url="{{ url_for('apiActualizarAppCompleta') }}"
                     data-estado-url="{{ url_for('apiActualizacionEstado') }}">
                    <h2 class="tituloPopupVersion">WebsTools</h2>
                    <p class="filaPopupVersion">Version instalada: <strong>v{{ version }}</strong></p>
                    <p class="filaPopupVersion">Ultima publicada: <strong id="popupVersionUltima">-</strong>
                        <span class="etiquetaVersion" id="popupVersionEtiqueta" hidden></span></p>
                    <p class="estadoPopupVersion" id="popupVersionEstado"></p>
                    <button type="button" class="botonAccion botonPopupVersion" id="popupVersionActualizar" hidden>Actualizar ahora</button>
                    <button type="button" class="botonSecundario botonPopupVersion" id="popupVersionComprobar">Comprobar versiones</button>
                </div>
            </div>
        </div>
        <div class="cabeceraDerecha">
            <span class="ipPublica">IP publica: {{ clientIp }}</span>
            <span class="fechaHora" id="fechaHora"></span>
            <a class="avisoActualizacion" id="avisoActualizacion" href="{{ url_for('ajustes') }}"
               data-api-url="{{ url_for('apiVersion') }}" hidden>Actualizacion disponible</a>
            <a class="enlaceAjustes" href="{{ url_for('ajustes') }}" title="Ajustes" aria-label="Ajustes">&#9881;</a>
        </div>
    </header>

    <main class="contenido">
        {% block content %}{% endblock %}
    </main>

    <footer class="pie">
        <a href="https://github.com/FranciscoFdez05" target="_blank" rel="noopener noreferrer">github.com/FranciscoFdez05</a>
    </footer>

    <script src="{{ url_for('static', filename='js/reloj.js') }}"></script>
    <script src="{{ url_for('static', filename='js/actualizacion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recientes.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
