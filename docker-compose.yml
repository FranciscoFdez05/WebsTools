services:
  webtools:
    build: .
    # Etiquetada con la version, no solo "latest": asi la imagen anterior sigue en
    # el disco y docker-update.sh puede volver a ella al instante si la nueva no
    # arranca, en vez de reconstruir desde el codigo viejo.
    image: webstools:${WEBSTOOLS_VERSION:-latest}
    container_name: webtools
    ports:
      # host:contenedor -- PORT viene del entorno (exportado por docker-up.sh
      # a partir de [server] port en config.ini, unica fuente del puerto).
      # Fijo (no efimero) y sin especificar IP de host, asi Docker lo publica en 0.0.0.0
      # (todas las interfaces), accesible desde otros dispositivos de la LAN
      - "${PORT:-8500}:${PORT:-8500}"
    volumes:
      # El clon del host montado sobre el codigo de la imagen. Sin esto, el "git pull" del
      # boton de actualizar solo tocaria la capa del contenedor: se perderia al recrearlo y
      # el siguiente ./docker-up.sh reconstruiria desde el clon viejo del host, deshaciendo
      # la actualizacion. Montado, actualizar desde la web deja host y contenedor a la vez.
      - .:/app
    environment:
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:?Falta SECRET_KEY, ejecuta ./docker-up.sh en vez de docker compose directamente}
      - WEBTOOLS_PORT=${PORT:-8500}
      - AJUSTES_PASSWORD=${AJUSTES_PASSWORD:-}
    restart: unless-stopped
    # restart: unless-stopped levanta la app si el proceso muere, pero no si se queda vivo
    # sin responder. Esto no la reinicia -- la politica de reinicio no mira la salud -- pero
    # deja el estado a la vista en "docker compose ps" y le da algo que consultar a cualquier
    # supervisor. urllib y no curl: la imagen slim no trae curl y Python ya esta dentro.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['WEBTOOLS_PORT']}/healthz\",timeout=5)"]
      interval: 30s
      timeout: 10s
      # gunicorn tarda un momento en atar el puerto: sin esto el primer intento falla
      start_period: 20s
      retries: 3
