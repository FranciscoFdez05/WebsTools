[server]
host = 0.0.0.0
# UNICA fuente del puerto de la app, tanto en local como en Docker.
# Para cambiarlo: edita SOLO este valor y arranca con ./docker-up.sh
# (exporta PORT para docker-compose automaticamente). No lo definas
# a mano en .env, docker-compose.yml ni como variable de entorno suelta.
port = 8500
debug = false

[app]
secretKey = dev-secret-key-change-in-production
maxUploadMb = 32
# Contrasena de /ajustes y de sus acciones (recargar herramientas, actualizar la app).
# Vacia = sin contrasena. Ponla si la app es accesible por gente en la que no confias
# del todo: desde ajustes se puede hacer que el servidor traiga y ejecute codigo nuevo.
ajustesPassword =
# Donde el limitador cuenta las peticiones por IP. Con un solo proceso (lo que arranca
# el Dockerfile) memory:// es correcto; para repartir en varios workers hace falta un
# contador compartido, por ejemplo redis://redis:6379
rateLimitStorageUri = memory://

[osint]
timeoutSegundos = 5
geolocalizacionUrl = http://ip-api.com/json/

[proxy]
# Ponlo en true SOLO si hay un proxy inverso delante (nginx, Traefik, Cloudflare) que
# reescriba X-Forwarded-For. Sin proxy, esa cabecera la elige quien hace la peticion:
# bastaria con cambiarla en cada llamada para tener rate limit infinito.
confiarXForwardedFor = false

[actualizaciones]
# Repositorio con el que se compara la version instalada (ultima release publicada).
repoGithub = FranciscoFdez05/WebsTools
timeoutSegundos = 5
# Permite que el boton de Ajustes traiga los cambios con git pull. Ponlo en false si
# prefieres actualizar a mano: la app seguira avisando de que hay una version nueva.
permitirAplicar = true
